name: Build and release macOS
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: macos-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt
      - name: Test
        run: python3 -m unittest discover -q
      - name: Set unique release version
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          p = pathlib.Path('app_version.py')
          text = p.read_text()
          base = re.search(r'APP_VERSION = "(\d+)\.(\d+)\.\d+"', text)
          version = f'{base[1]}.{base[2]}.{os.environ["GITHUB_RUN_NUMBER"]}'
          p.write_text(re.sub(r'APP_VERSION = "[^"]+"', f'APP_VERSION = "{version}"', text))
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'RELEASE_VERSION={version}\n')
          PY
      - name: Build and verify
        run: |
          test "$(uname -m)" = arm64
          bash build.sh
          codesign --verify --deep --strict "dist/MaoLocal Codex 管理器.app"
          hdiutil verify "dist/MaoLocal-Codex-Manager-${RELEASE_VERSION}-arm64.dmg"
          python3 scripts/release_manifest.py
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: |
            dist/*.dmg
            dist/update.json
          retention-days: 14
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${RELEASE_VERSION}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "MaoLocal Codex 管理器 $RELEASE_VERSION" --generate-notes --draft
          fi
          gh release upload "$TAG" "dist/MaoLocal-Codex-Manager-${RELEASE_VERSION}-arm64.dmg" dist/update.json --clobber
          gh release edit "$TAG" --draft=false --latest
